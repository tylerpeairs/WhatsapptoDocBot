<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f1f1f1;
            flex-direction: column; /* Align items vertically */
        }

        .container {
            text-align: center; /* Center the content of the div */
        }

        p, button {
            color: green;
            margin: 5px 0; /* Add some space between the paragraph and the button */
        }
    </style>
</head>
<body>
    {% if message %}
        <div class="container">
            <p>{{ message }}</p>
        </div>
        <div class="container">
            <button onclick="window.close();">Close Tab</button>
        </div>
    {% endif %}
</body>
</html>
